name: scheduled

on:
  repository_dispatch: {}
  workflow_dispatch: {}
  schedule:
    - cron: "00 18 * * *"

permissions:
  contents: read

jobs:
  schedule:
    uses: miracum/.github/.github/workflows/standard-schedule.yaml@cca0bcc51093bb9292344cdefd5eeff9cf41c973 # v1.32.1
    permissions:
      contents: read
      issues: write
      security-events: write
