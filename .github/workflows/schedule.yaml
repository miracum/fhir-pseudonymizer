name: scheduled

on:
  repository_dispatch: {}
  workflow_dispatch: {}
  schedule:
    - cron: "00 18 * * *"

permissions:
  contents: read

jobs:
  schedule:
    uses: miracum/.github/.github/workflows/standard-schedule.yaml@d9d87af182ffe0ef4958e61dd1e697c7fd83c52f # v1.31.2
    permissions:
      contents: read
      issues: write
      security-events: write
