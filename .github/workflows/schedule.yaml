name: scheduled

on:
  repository_dispatch: {}
  workflow_dispatch: {}
  schedule:
    - cron: "00 18 * * *"

permissions:
  contents: read

jobs:
  schedule:
    uses: miracum/.github/.github/workflows/standard-schedule.yaml@074c1a65db6f09850cd80f38efe230036febb44e # v1.29.2
    permissions:
      contents: read
      issues: write
      security-events: write
