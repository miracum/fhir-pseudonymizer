name: nightly chaos testing

on:
  workflow_dispatch: {}
  schedule:
    # daily at 06:23
    - cron: "23 06 * * *"

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  chaos-testing:
    name: chaos testing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create KinD cluster
        run: kind create cluster --name kind

      - name: Install the argo workflows CLI
        working-directory: tests/chaos
        run: |
          curl -sL -o - https://github.com/argoproj/argo-workflows/releases/download/v3.5.2/argo-linux-amd64.gz | gunzip > argo
          chmod +x ./argo
          ./argo version

      - name: Install the prerequisites (vfps and argo workflows)
        working-directory: tests/chaos
        run: |
          helm dependency update ../prerequisites
          helm upgrade --install --create-namespace -n fhir-pseudonymizer \
            -f prerequisites-values.yaml \
            --wait --timeout 10m \
            prerequisites ../prerequisites

      - name: Install fhir-pseudonymizer
        working-directory: tests/chaos
        run: |
          helm dependency update ../../charts/fhir-pseudonymizer
          helm upgrade --install -n fhir-pseudonymizer \
            -f fhir-pseudonymizer-values.yaml \
            --wait \
            fhir-pseudonymizer ../../charts/fhir-pseudonymizer

      - name: Install chaos-mesh and the chaos test resources
        working-directory: tests/chaos
        run: |
          helm repo add chaos-mesh https://charts.chaos-mesh.org
          kubectl create configmap k6-chaos-script --from-file=k6-chaos-test.js -n fhir-pseudonymizer --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap chaos-yaml --from-file=chaos.yaml -n fhir-pseudonymizer --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install chaos-mesh chaos-mesh/chaos-mesh --create-namespace --wait -n chaos-mesh \
            --set chaosDaemon.runtime=containerd \
            --set chaosDaemon.socketPath='/run/containerd/containerd.sock'
          kubectl apply -f chaos-mesh-rbac.yaml

      - name: Run chaos test
        working-directory: tests/chaos
        run: ./argo submit workflow.yaml -n fhir-pseudonymizer --wait --log

      - name: Print cluster logs
        if: always()
        run: |
          kubectl cluster-info dump -o yaml | tee kind-cluster-dump.txt

      - name: Upload cluster dump
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-cluster-dump.txt
          path: |
            kind-cluster-dump.txt
