name: ci

on:
  push:
    branches: [master]
  release:
    types: [created]
  pull_request:
    branches: [master, beta]
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  build:
    uses: miracum/.github/.github/workflows/standard-build.yaml@074c1a65db6f09850cd80f38efe230036febb44e # v1.29.2
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
      attestations: write
      artifact-metadata: write
    with:
      enable-build-test-layer: true
      enable-upload-test-image: true
      platforms: |
        linux/amd64
        linux/arm64

  # ct install (inside standard-chart-publish.yaml's install job) only runs on PRs that change
  # something under the chart's own directory - it's gated by `ct list-changed`, a plain git diff
  # scoped to the chart directory that has no idea `chart.helm-extra-set-args` below even exists.
  # Without this, a PR that only touches src/ or the Dockerfile would build and push a new image
  # but never actually deploy it via the chart, silently skipping the one check that would catch
  # an image that fails its readiness/liveness probes or otherwise can't come up under Helm.
  detect-app-changes:
    name: detect changes affecting chart deployability
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes under src/ or the Dockerfile since the PR's base
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # only meaningful for pull_request events. push/release/merge_group already get a full
          # ct install regardless (list-changed's own base-branch diff has nothing to compare
          # against on those), so there's nothing for this job to add there.
          if [ "${EVENT_NAME}" != "pull_request" ] ||
            git diff --quiet "${BASE_SHA}" -- src/ Dockerfile charts/fhir-pseudonymizer/; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  chart:
    needs:
      - build
      - detect-app-changes
    uses: miracum/.github/.github/workflows/standard-chart-publish.yaml@43926b6aa69b5a63e15378200f698ce8cfeefc88 # v1.29.3
    permissions:
      contents: read
      packages: write # to push the chart and its signature/attestation to ghcr.io
      id-token: write # for keyless chart signing and OIDC-based attestations
      attestations: write # to publish build provenance attestations
      artifact-metadata: write # required by actions/attest-build-provenance
    with:
      chart-path: charts/fhir-pseudonymizer
      # published as ghcr.io/miracum/fhir-pseudonymizer/charts/fhir-pseudonymizer rather than the
      # default ghcr.io/miracum/fhir-pseudonymizer/fhir-pseudonymizer, matching the
      # .../charts/<name> layout used elsewhere in the org (e.g. vfps).
      registry: ghcr.io/${{ github.repository }}/charts
      # stable per PR (no commit sha), so every push to the same PR overwrites this one OCI tag
      # instead of piling up a new prerelease version per commit. Empty on every other event,
      # which falls back to the workflow's own default: release events use the release tag,
      # everything else uses Chart.yaml's version.
      version: ${{ github.event_name == 'pull_request' && format('0.0.0-pr{0}', github.event.pull_request.number) || '' }}
      lint-config: .github/ct/ct.yaml
      # force ct install to run even when the PR doesn't touch charts/fhir-pseudonymizer/ itself,
      # as long as it changed something that could affect whether the chart still deploys (see
      # detect-app-changes above).
      install-all: ${{ needs.detect-app-changes.outputs.changed == 'true' }}
      # test ct install against the image this PR just built instead of the tag baked into
      # values.yaml, so a PR can't pass chart testing against a stale/unrelated release image.
      # Restricted to same-repo PRs: forked PRs never get their image pushed to ghcr.io (see
      # standard-build.yaml), so kind wouldn't be able to pull it - falls back to the chart's
      # default tag there.
      helm-extra-set-args: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) && format('--set=image.tag={0}', needs.build.outputs.image-version) || '' }}
      image-digest: ${{ needs.build.outputs.image-digest }}
      image-tag-path: .image.tag

  test:
    runs-on: ubuntu-24.04
    name: unit test
    needs:
      - build
    permissions:
      # for add Coverage PR Comment
      pull-requests: write
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: ${{ needs.build.outputs.image-slug }}
          path: /tmp

      - name: Load image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          ls -lsa /tmp
          docker load --input /tmp/image.tar
          docker image ls

      - name: Download test image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}-test
          path: /tmp

      - name: Load test image
        run: |
          ls -lsa /tmp
          docker load --input /tmp/image-test.tar
          docker image ls

      - name: Copy unit test coverage reports from test container
        env:
          UNIT_TEST_IMAGE: ${{ fromJson(needs.build.outputs.test-image-meta-json).tags[0] }}
        run: |
          docker create --name=unit-test-container "${UNIT_TEST_IMAGE}"
          docker cp unit-test-container:/build/src/FhirPseudonymizer.Tests/coverage ./coverage

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "50 50"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # when running from a fork, the CI token doesn't have enough permissions to create PR comments
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        with:
          recreate: true
          path: code-coverage-results.md

  k6-benchmark:
    name: k6 benchmark
    runs-on: ubuntu-24.04
    # the container image is only uploaded as an artifact for pull_request events, see
    # standard-build.yaml's "Upload container image" step.
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - build
    permissions:
      contents: read
      pull-requests: write
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}
          path: /tmp

      - name: Load image
        run: |
          docker load --input /tmp/image.tar
          docker image ls

      - name: Run container
        env:
          IMAGE: ${{ fromJson(needs.build.outputs.image-meta-json).tags[0] }}
        run: |
          # there is no default anonymization config. Use the same rules the k6 script sends as the
          # dynamic config so both scenarios apply identical rules.
          docker run -d --name=fhir-pseudonymizer -p 8080:8080 \
            -e PseudonymizationService=None \
            -e AnonymizationEngineConfigPath=/etc/anonymization.yaml \
            -v "${PWD}/src/FhirPseudonymizer/anonymization.yaml:/etc/anonymization.yaml:ro" \
            "${IMAGE}"

      - name: Wait for container to become ready
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/fhir/metadata > /dev/null; then
              echo "container is ready"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become ready in time" >&2
          exit 1

      - name: Run k6 benchmark
        env:
          BASE_URL: http://localhost:8080
          VUS: "10"
          DURATION_SECONDS: "15"
          # <https://hub.docker.com/r/grafana/k6>
          K6_IMAGE: grafana/k6:2.1.0@sha256:65c920dc067d5e2e00befbf982af6ad6ad0117034e8b1c65817c7975c52d4669
        run: |
          docker run --rm --network host \
            -v "${PWD}:/home/k6" \
            -e BASE_URL -e VUS -e DURATION_SECONDS \
            "${K6_IMAGE}" run --quiet benchmark/k6/de-identify-comparison.js \
            2>&1 | tee benchmark/k6/k6-output.txt || true

      - name: Container logs
        if: always()
        run: docker logs fhir-pseudonymizer

      - name: Format k6 output for use as a PR comment
        run: |
          K6_OUTPUT=$(cat benchmark/k6/k6-output.txt)
          {
            echo -e '---';
            # shellcheck disable=SC2016 # the $ is a literal part of the FHIR operation name, not an expansion
            echo -e '## k6 benchmark: static vs. dynamic config `$de-identify`';
            echo -e '```console';
            echo -e "${K6_OUTPUT}";
            echo -e '```'
          } >> k6-output.md

      - name: Add sticky comment with k6 benchmark results
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # when running from a fork, the CI token doesn't have enough permissions to create PR comments
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          header: k6-benchmark
          recreate: true
          path: k6-output.md

  iter8-test:
    name: run iter8 tests
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - build
    permissions:
      contents: read
      pull-requests: write
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install iter8 cli
        env:
          ITER8_CLI_URL: "https://github.com/iter8-tools/iter8/releases/download/v0.13.18/iter8-linux-amd64.tar.gz"
        run: |
          curl -LSs "${ITER8_CLI_URL}" | tar xz
          mv linux-amd64/iter8 /usr/local/bin/iter8
          chmod +x /usr/local/bin/iter8
          iter8 version

      - name: Create KinD cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kind

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}
          path: /tmp

      - name: Load image into KinD
        run: |
          kind load image-archive /tmp/image.tar

      - name: List images in cluster
        run: docker exec kind-control-plane crictl images

      - name: Install "vfps"
        run: |
          helm dependency update tests/prerequisites
          helm install \
            --set="argo-workflows.enabled=false" \
            --wait \
            --timeout=10m \
            prerequisites \
            tests/prerequisites

      - name: Install "fhir-pseudonymizer"
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-version }}
        run: |
          helm dependency update charts/fhir-pseudonymizer
          helm install \
            --set="image.tag=${IMAGE_TAG}" \
            -f tests/iter8/values.yaml \
            --wait \
            --timeout=10m \
            fhir-pseudonymizer \
            charts/fhir-pseudonymizer

      - name: Launch iter8 experiment
        run: kubectl apply -f tests/iter8/experiment.yaml

      - name: Wait for experiment completion
        run: iter8 k assert -c completed --timeout 10m

      - name: Assert no failures and SLOs are satisfied
        run: iter8 k assert -c nofailure,slos

      - name: Create iter8 reports
        if: always()
        run: |
          iter8 k report | tee iter8-report.txt
          iter8 k report -o html > iter8-report.html

      - name: Enhance iter8 report output for use as a PR comment
        run: |
          ITER8_REPORT_TXT=$(cat iter8-report.txt)
          {
            echo -e '---';
            echo -e '## iter8 report';
            echo -e '```console';
            echo -e "${ITER8_REPORT_TXT}";
            echo -e '```'
          } >> iter8-output.md

      - name: Append sticky comment with iter8 report
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # when running from a fork, the CI token doesn't have enough permissions to create PR comments
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        with:
          append: true
          path: iter8-output.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iter8-report.html
          path: |
            iter8-report.html

      - name: Print cluster and iter8 logs
        if: always()
        run: |
          kubectl cluster-info dump -o yaml | tee kind-cluster-dump.txt
          iter8 k log -l trace

      - name: Upload cluster dump
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-cluster-dump.txt
          path: |
            kind-cluster-dump.txt

  lint:
    uses: miracum/.github/.github/workflows/standard-lint.yaml@074c1a65db6f09850cd80f38efe230036febb44e # v1.29.2
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
      actions: read
    with:
      enable-validate-gradle-wrapper: false
      codeql-languages: '["csharp"]'
      enable-codeql: true
      dotnet-version: "10.0.x"

  docs:
    runs-on: ubuntu-24.04
    name: docs
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # the built site is published from this workflow, so it must not restore anything a
          # pull request run could have written
          enable-cache: false

      # --strict fails the build on broken links between pages.
      - name: Build site
        run: uv run --locked zensical build --strict

      - name: Upload docs site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  playground:
    runs-on: ubuntu-24.04
    name: playground
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish src/FhirPseudonymizer.Playground/FhirPseudonymizer.Playground.csproj -c Release -o publish-output

      - name: Upload playground site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playground-site
          path: publish-output/wwwroot

  microbenchmarks:
    runs-on: ubuntu-24.04
    name: microbenchmarks
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      # to store the benchmark history on the `gh-pages` branch on pushes to master
      contents: write
      # to comment on the PR if a benchmark regresses
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run microbenchmarks
        run: |
          dotnet run -c Release --project src/FhirPseudonymizer.Benchmarks -- \
            --filter '*' --join --exporters json

      - name: Normalize BenchmarkDotNet result file name
        run: |
          mv BenchmarkDotNet.Artifacts/results/BenchmarkRun-joined-*-report-full-compressed.json \
            BenchmarkDotNet.Artifacts/results/benchmarks.json

      # on PRs: only compare against the stored history and comment if something regressed.
      # Never pushes: a fork's GITHUB_TOKEN couldn't push to this repo anyway, and pushing from PR
      # branches isn't something we want regardless. See
      # https://github.com/benchmark-action/github-action-benchmark
      - name: Compare against previous benchmark results
        if: ${{ github.event_name == 'pull_request' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: "benchmarkdotnet"
          output-file-path: BenchmarkDotNet.Artifacts/results/benchmarks.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          comment-on-alert: ${{ !github.event.pull_request.head.repo.fork }}
          alert-threshold: "150%"
          fail-on-alert: false
          summary-always: true

      # on pushes to master: persist the new data point to the `gh-pages` branch (creating it on
      # the first run) under `dev/bench/`, then hand the rendered dashboard to the deploy-pages
      # job as a plain artifact (that job isn't allowed to push, so it can't fetch this itself).
      - name: Update benchmark history
        if: ${{ github.event_name == 'push' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: "benchmarkdotnet"
          output-file-path: BenchmarkDotNet.Artifacts/results/benchmarks.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: dev/bench
          auto-push: true

      # benchmark-action/github-action-benchmark commits/pushes to gh-pages by switching the
      # checkout to that branch in-place, then switches back to master ("git checkout -") once
      # done - so by this point dev/bench no longer exists anywhere in the working tree. Extract
      # it directly from the gh-pages ref instead of relying on it being present on disk.
      - name: Export benchmark dashboard for upload
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin gh-pages
          mkdir -p dashboard-export
          # actions/checkout's fetch refspec is narrow, so this fetch only sets FETCH_HEAD rather
          # than a origin/gh-pages remote-tracking ref - reference that directly instead.
          git archive FETCH_HEAD dev/bench | tar -x --strip-components=2 -C dashboard-export

      - name: Upload benchmark dashboard artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-dashboard
          path: dashboard-export

  deploy-pages:
    name: deploy pages
    # the docs, playground and microbenchmarks jobs build independently of each other and of the
    # container `build` job; this is the only job that combines and publishes their output.
    if: ${{ github.ref == 'refs/heads/master' }}
    needs:
      - docs
      - playground
      - microbenchmarks
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: pages-root/docs

      - name: Download playground site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playground-site
          path: pages-root/playground

      - name: Download benchmark dashboard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmarks-dashboard
          path: pages-root/benchmarks

      # nothing else lives at the site root, so send visitors on to the documentation
      - name: Add root redirect to the documentation
        run: |
          cat > pages-root/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>FHIR Pseudonymizer</title>
              <meta http-equiv="refresh" content="0; url=docs/" />
              <link rel="canonical" href="https://miracum.github.io/fhir-pseudonymizer/docs/" />
            </head>
            <body>
              <p>Redirecting to the <a href="docs/">FHIR Pseudonymizer documentation</a>.</p>
            </body>
          </html>
          EOF

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
