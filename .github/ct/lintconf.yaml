---
# yamllint config for `ct lint` (see ct.yaml's `lint-conf` key and the chart job in ci.yaml).
# Identical to chart-testing's own bundled default, except `comments.min-spaces-from-content`
# is relaxed from 2 to 1: Chart.yaml and values.yaml use single-space `# x-release-please-version`
# markers (matching this repo's compose.yaml and release-please-config.json's extra-files entries)
# for release-please to bump the chart version in lockstep with the app, and the default rule
# rejects that spacing.
rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: -1
    max-spaces-inside-empty: -1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
    min-spaces-inside-empty: -1
    max-spaces-inside-empty: -1
  colons:
    max-spaces-before: 0
    max-spaces-after: 1
  commas:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1
  comments:
    require-starting-space: true
    min-spaces-from-content: 1
  document-end: disable
  document-start: disable # No --- to start a file
  empty-lines:
    max: 2
    max-start: 0
    max-end: 0
  hyphens:
    max-spaces-after: 1
  indentation:
    spaces: consistent
    indent-sequences: whatever # - list indentation will handle both indentation and without
    check-multi-line-strings: false
  key-duplicates: enable
  line-length: disable # Lines can be any length
  new-line-at-end-of-file: enable
  new-lines:
    type: unix
  trailing-spaces: enable
  truthy:
    level: warning
