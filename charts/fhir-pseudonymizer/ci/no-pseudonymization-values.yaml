# encrypts identifiers instead of pseudonymizing them, so no pseudonymization service is needed.
# keys are set via environment variables instead of inside the anonymization config. They must be at least 32 bytes long.
# `None` is set explicitly so the chart also installs with images from before 3.0.0, which defaulted to gPAS.
extraEnvDict:
  PseudonymizationService: None
  Anonymization__EncryptKey: ci-only-not-a-secret-key-0123456
  Anonymization__CryptoHashKey: ci-only-not-a-secret-key-0123456

anonymizationConfig: |
  ---
  fhirVersion: R4
  fhirPathRules:
    - path: nodesByType('HumanName')
      method: redact
    - path: nodesByType('Identifier').where(type.coding.where(system='http://terminology.hl7.org/CodeSystem/v2-0203' and code='VN').exists()).value
      method: encrypt
    - path: nodesByType('Identifier').where(type.coding.where(system='http://terminology.hl7.org/CodeSystem/v2-0203' and code='MR').exists()).value
      method: encrypt
  parameters:
    dateShiftKey: ""
    dateShiftScope: resource
    enablePartialAgesForRedact: true
    enablePartialDatesForRedact: true
    enablePartialZipCodesForRedact: true
    restrictedZipCodeTabulationAreas: []
