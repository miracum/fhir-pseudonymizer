# Tooling for the documentation site only (see zensical.toml) - the FHIR Pseudonymizer itself is a .NET project.
# `uv run zensical serve` previews the site at http://localhost:8000/.
[project]
name = "fhir-pseudonymizer-docs"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["zensical==0.0.67"]

[tool.uv]
package = false
