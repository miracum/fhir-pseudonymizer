# Documentation site, published to https://miracum.github.io/fhir-pseudonymizer/docs/ by the
# deploy-pages job in .github/workflows/ci.yaml.
# Preview locally with `uv run zensical serve`.

[project]
site_name = "FHIR Pseudonymizer"
site_url = "https://miracum.github.io/fhir-pseudonymizer/docs/"
site_description = "A REST and Kafka service for de-identifying FHIR resources."
site_author = "The FHIR Pseudonymizer developers"
copyright = "Copyright &copy; The FHIR Pseudonymizer developers. Licensed under the MIT License."

repo_url = "https://github.com/miracum/fhir-pseudonymizer"
repo_name = "miracum/fhir-pseudonymizer"
edit_uri = "edit/master/docs/"

docs_dir = "docs"

extra_css = ["assets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guides" = [
    { "De-identification" = "de-identify.md" },
    { "Dynamic rules and config" = "dynamic-config.md" },
    { "Crypto-hash and keys" = "crypto-hash.md" },
    { "Reading from Kafka" = "kafka.md" },
    { "Provenance" = "provenance.md" },
  ] },
  { "Pseudonymization services" = [
    { "gPAS" = "pseudonymization/gpas.md" },
    { "Vfps" = "pseudonymization/vfps.md" },
    { "entici" = "pseudonymization/entici.md" },
    { "MII" = "pseudonymization/mii.md" },
  ] },
  { "Operations" = [
    { "Configuration reference" = "configuration.md" },
    { "Observability" = "observability.md" },
    { "Image verification" = "image-verification.md" },
  ] },
  { "Performance" = "performance.md" },
  { "Development" = "development.md" },
  { "About" = "about.md" },
]

[project.theme]
language = "en"
logo = "img/logo.svg"
favicon = "img/logo.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue-grey"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue-grey"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/miracum/fhir-pseudonymizer"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
