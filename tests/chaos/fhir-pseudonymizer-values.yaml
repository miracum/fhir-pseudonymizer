replicaCount: 3

image:
  tag: v2.38.0 # x-release-please-version

anonymizationConfig: |
  ---
  fhirVersion: R4
  fhirPathRules:
    - path: Resource.id
      method: cryptoHash
    - path: nodesByType('HumanName')
      method: redact
    - path: nodesByType('Identifier').where(type.coding.system='http://terminology.hl7.org/CodeSystem/v2-0203' and type.coding.code='MR').value
      method: pseudonymize
      namespace: stress
  parameters:
    dateShiftKey: ""
    dateShiftScope: resource
    cryptoHashKey: 30c1395bd83653260b45a499ee75e901d2e6a02f1fdd859b30b915136d8bd70b
    encryptKey: ""
    enablePartialAgesForRedact: true
    enablePartialDatesForRedact: true
    enablePartialZipCodesForRedact: true
    restrictedZipCodeTabulationAreas: []

pseudonymizationService: Vfps

vfps:
  enabled: true
  replicaCount: 3
  postgresql:
    auth:
      database: "vfps"
  appsettings: |
    {
      "Init": {
        "v1": {
          "Namespaces": [
            {
              "Name": "stress",
              "Description": "a namespace for stress testing",
              "PseudonymGenerationMethod": "Sha256HexEncoded",
              "PseudonymLength": 64,
              "PseudonymPrefix": "stress-"
            }
          ]
        }
      }
    }
