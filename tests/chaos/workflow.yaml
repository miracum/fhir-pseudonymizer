# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/v3.4.3/api/jsonschema/schema.json
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fhir-pseudonymizer-chaos-workflow-
spec:
  entrypoint: run-chaos-and-test
  serviceAccountName: chaos-mesh-cluster-manager
  onExit: exit-handler
  templates:
    - name: test
      volumes:
        - name: k6-chaos-script
          configMap:
            name: k6-chaos-script
      container:
        # <https://hub.docker.com/r/grafana/k6>
        image: docker.io/grafana/k6:2.1.0@sha256:65c920dc067d5e2e00befbf982af6ad6ad0117034e8b1c65817c7975c52d4669
        imagePullPolicy: IfNotPresent
        command:
          - k6
        args:
          - run
          - --quiet
          - /scripts/k6-chaos-test.js
        env:
          - name: BASE_URL
            value: http://fhir-pseudonymizer:8080
        volumeMounts:
          - name: k6-chaos-script
            mountPath: /scripts
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
          runAsUser: 12345
          runAsGroup: 12345

    - name: install-chaos
      volumes:
        - name: chaos-yaml
          configMap:
            name: chaos-yaml
      container:
        # <https://hub.docker.com/r/rancher/kubectl>
        image: docker.io/rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
        imagePullPolicy: IfNotPresent
        command:
          - kubectl
        args:
          - apply
          - -f
          - /config/chaos.yaml
        volumeMounts:
          - name: chaos-yaml
            mountPath: /config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532

    - name: delete-chaos
      volumes:
        - name: chaos-yaml
          configMap:
            name: chaos-yaml
      container:
        image: docker.io/rancher/kubectl:v1.36.2@sha256:06c7a7a9772737494ae1e0c3af90f1b5385630c147e47c1c7cea92f4bed55fbe
        imagePullPolicy: IfNotPresent
        command:
          - kubectl
        args:
          - delete
          - -f
          - /config/chaos.yaml
        volumeMounts:
          - name: chaos-yaml
            mountPath: /config
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532

    - name: exit-handler
      steps:
        - - name: delete-chaos
            template: delete-chaos

    - name: run-chaos-and-test
      steps:
        - - name: install-chaos
            template: install-chaos
        - - name: test
            template: test
